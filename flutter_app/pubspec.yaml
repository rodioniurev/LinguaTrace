name: lingua_trace
description: Quick translator with language-learning analytics
version: 2.5.0+7
publish_to: none

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.3.3
  # Bumped 2.3.3 -> latest to stay compatible with sqlite3 3.x pulled by flutter_gemma.
  sqflite_common_ffi: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_riverpod: ^2.5.1
  # ≥ 1.5: the RSS fetcher uses AbortableRequest.
  http: ^1.5.0
  google_mlkit_translation: ^0.13.0
  speech_to_text: ^7.0.0
  shared_preferences: ^2.2.3
  # On-device LLM via LiteRT-LM (Gemma 3 1B / Qwen 2.5 1.5B)
  flutter_gemma: ^0.15.3
  flutter_launcher_icons: ^0.14.1
  cupertino_icons: ^1.0.6
  # News feed: RSS/Atom parsing (dart_rss conflicts with the locked intl),
  # dedupe keys, and "open the original article".
  xml: ^6.5.0
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # The sync server (../server): the tests sync real devices through it.
  linguatrace_sync:
    path: ../server

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1e1e2e"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
    # assets/dict/ â€” re-add when an es_wiktionary.db is actually shipped.
    # DictionaryService degrades gracefully when the DB is missing.
    - assets/proverbs/
    - assets/feed/
